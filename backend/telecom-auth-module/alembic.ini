# Alembic configuration for the Telecom SaaS platform.
#
# The database URL is intentionally NOT set here. env.py reads it from
# app.core.config.settings (single source of truth, no credentials committed).

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = alembic

# Template used to generate migration file names. A date prefix keeps them
# chronologically sortable on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Use OS-native path separators.
path_separator = os

# Timezone for file_template timestamps (UTC for consistency across machines).
timezone = UTC

# sqlalchemy.url is deliberately omitted — env.py injects it from settings.
# sqlalchemy.url =

[post_write_hooks]
# Optional: auto-format generated migrations. Uncomment if black is installed.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# --- Logging ---------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
